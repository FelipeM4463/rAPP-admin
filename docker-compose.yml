# Caminho alternativo quando o Docker estiver disponível.
# A modelagem pede PostgreSQL 16 + PostGIS 3.4. Nesta máquina o painel
# sobe num cluster local PostgreSQL 14 + PostGIS 3.2, com o mesmo schema.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: rapp
      POSTGRES_PASSWORD: rapp
      POSTGRES_DB: rapp
    ports:
      - "5433:5432"
    volumes:
      - rapp_pg:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/zz-schema.sql:ro

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rapp
      MINIO_ROOT_PASSWORD: rapp-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rapp_s3:/data

volumes:
  rapp_pg:
  rapp_s3:
